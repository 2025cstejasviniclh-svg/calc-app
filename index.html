<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#e0f2fe" />
  <title>Calc App</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="calculator">
    <!-- Top Bar with History Toggle -->
    <div class="top-bar">
      <span class="app-title">Calculator</span>
      <button id="history-toggle" class="icon-btn" title="View History">🕒</button>
    </div>

    <!-- Main Display -->
    <div class="display">
      <div id="history" class="history"></div>
      <div id="result" class="result">0</div>
    </div>
    
    <!-- Keypad -->
    <div class="buttons">
      <!-- Row 1 -->
      <button class="btn action" data-key="Clear">AC</button>
      <button class="btn action" data-key="Backspace">DEL</button>
      <button class="btn operator" data-key="%">%</button>
      <button class="btn operator" data-key="/">÷</button>
      
      <!-- Row 2 -->
      <button class="btn number" data-key="7">7</button>
      <button class="btn number" data-key="8">8</button>
      <button class="btn number" data-key="9">9</button>
      <button class="btn operator" data-key="*">×</button>
      
      <!-- Row 3 -->
      <button class="btn number" data-key="4">4</button>
      <button class="btn number" data-key="5">5</button>
      <button class="btn number" data-key="6">6</button>
      <button class="btn operator" data-key="-">−</button>
      
      <!-- Row 4 -->
      <button class="btn number" data-key="1">1</button>
      <button class="btn number" data-key="2">2</button>
      <button class="btn number" data-key="3">3</button>
      <button class="btn operator" data-key="+">+</button>
      
      <!-- Row 5 -->
      <button class="btn number zero" data-key="0">0</button>
      <button class="btn number" data-key=".">.</button>
      <button class="btn equal" data-key="Enter">=</button>
    </div>

    <!-- History Slide Drawer -->
    <div id="history-drawer" class="history-drawer">
      <div class="drawer-header">
        <span>Calculation Log</span>
        <button id="close-drawer" class="icon-btn">✕</button>
      </div>
      <div id="history-list" class="history-list">
        <p class="empty-msg">No calculations yet</p>
      </div>
      <button id="clear-history" class="clear-log-btn">Clear Log</button>
    </div>
  </div>
</body>
</html>
